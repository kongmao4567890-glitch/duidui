<!-- 鼓手猴：左侧装饰立绘 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3773f"/><stop offset="1" stop-color="#7a4a20"/>
    </linearGradient>
    <linearGradient id="face2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdcae"/><stop offset="1" stop-color="#e8b077"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05a3c"/><stop offset="1" stop-color="#8e2d1a"/>
    </linearGradient>
  </defs>

  <!-- 鼓 -->
  <ellipse cx="80" cy="146" rx="46" ry="14" fill="#5a1c0f"/>
  <rect x="34" y="116" width="92" height="30" fill="url(#drum)"/>
  <ellipse cx="80" cy="116" rx="46" ry="14" fill="#f6d365"/>
  <ellipse cx="80" cy="116" rx="38" ry="10" fill="#fff3c4"/>
  <path d="M34 124 h92 M34 136 h92" stroke="#ffd166" stroke-width="3" opacity="0.6"/>

  <!-- 身体 -->
  <ellipse cx="80" cy="88" rx="34" ry="32" fill="url(#fur)"/>
  <ellipse cx="80" cy="92" rx="22" ry="22" fill="url(#face2)" opacity="0.5"/>

  <!-- 手臂与鼓槌 -->
  <path d="M52 78 q-20 -6 -26 -22" stroke="#8a5528" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M108 78 q20 -6 26 -22" stroke="#8a5528" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M24 56 l-8 -16" stroke="#d9a15c" stroke-width="6" stroke-linecap="round"/>
  <path d="M136 56 l8 -16" stroke="#d9a15c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="14" cy="37" r="7" fill="#f6d365"/>
  <circle cx="146" cy="37" r="7" fill="#f6d365"/>

  <!-- 耳朵 -->
  <circle cx="46" cy="44" r="13" fill="url(#fur)"/>
  <circle cx="114" cy="44" r="13" fill="url(#fur)"/>
  <circle cx="46" cy="44" r="7" fill="#e8b077"/>
  <circle cx="114" cy="44" r="7" fill="#e8b077"/>

  <!-- 头 -->
  <circle cx="80" cy="46" r="30" fill="url(#fur)"/>
  <ellipse cx="80" cy="54" rx="22" ry="19" fill="url(#face2)"/>
  <ellipse cx="70" cy="42" rx="6" ry="7" fill="#3a2418"/>
  <ellipse cx="90" cy="42" rx="6" ry="7" fill="#3a2418"/>
  <circle cx="72" cy="39.5" r="2.2" fill="#fff"/>
  <circle cx="92" cy="39.5" r="2.2" fill="#fff"/>
  <ellipse cx="80" cy="56" rx="4" ry="3" fill="#a5563f"/>
  <path d="M71 62 q9 8 18 0" stroke="#a5563f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
