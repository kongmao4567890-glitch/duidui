<!-- 圆滚滚：左下角装饰吉祥物 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" width="150" height="140">
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffc0cb"/><stop offset="0.55" stop-color="#ff7d95"/><stop offset="1" stop-color="#d13a5c"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa9ff"/><stop offset="1" stop-color="#2a5bb8"/>
    </linearGradient>
  </defs>

  <ellipse cx="75" cy="130" rx="46" ry="9" fill="#000" opacity="0.28"/>

  <!-- 身体 -->
  <circle cx="75" cy="82" r="48" fill="url(#body)"/>
  <ellipse cx="58" cy="64" rx="17" ry="13" fill="#fff" opacity="0.4"/>

  <!-- 耳朵 -->
  <ellipse cx="36" cy="52" rx="13" ry="16" fill="#e8567a" transform="rotate(-24 36 52)"/>
  <ellipse cx="114" cy="52" rx="13" ry="16" fill="#e8567a" transform="rotate(24 114 52)"/>

  <!-- 帽子 -->
  <path d="M40 46 q35 -28 70 0 z" fill="url(#hat)"/>
  <rect x="34" y="42" width="82" height="10" rx="5" fill="#1f478f"/>
  <circle cx="75" cy="20" r="8" fill="#ffd166"/>

  <!-- 脸 -->
  <ellipse cx="58" cy="78" rx="7" ry="9" fill="#3a2418"/>
  <ellipse cx="92" cy="78" rx="7" ry="9" fill="#3a2418"/>
  <circle cx="60.5" cy="75" r="2.6" fill="#fff"/>
  <circle cx="94.5" cy="75" r="2.6" fill="#fff"/>
  <ellipse cx="75" cy="94" rx="14" ry="10" fill="#ffb3c4"/>
  <ellipse cx="69" cy="93" rx="3" ry="4" fill="#c25070"/>
  <ellipse cx="81" cy="93" rx="3" ry="4" fill="#c25070"/>
  <ellipse cx="40" cy="92" rx="9" ry="5" fill="#ff5f80" opacity="0.6"/>
  <ellipse cx="110" cy="92" rx="9" ry="5" fill="#ff5f80" opacity="0.6"/>

  <!-- 小手 -->
  <circle cx="30" cy="100" r="11" fill="#ff7d95"/>
  <circle cx="120" cy="100" r="11" fill="#ff7d95"/>
</svg>
